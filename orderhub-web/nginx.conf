server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API: this replaces the Vite dev proxy. The browser calls /api/..., nginx forwards it to the
    # backend container and removes the "/api" part (the trailing slash after 8080 does that):
    #   GET /api/products  ->  GET http://backend:8080/products
    # "backend" is the service name from docker-compose.yml; Docker resolves it to the container.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a hash in their name, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: a URL like /orders/12 has no file, so serve index.html and let React Router
    # show the right page. Without this, reloading on any page except "/" would give a 404.
    location / {
        try_files $uri /index.html;
    }
}
