name: CI

# When it runs: on every push to main, and on every pull request.
on:
  push:
    branches: [main]
  pull_request:

# If you push twice quickly, cancel the older run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token given to the workflow can only read the repository, unless a job asks for more.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # 1. Backend: compile and run ALL tests (they start MySQL in Docker through Testcontainers;
  #    GitHub's Linux runners have Docker installed).
  # ---------------------------------------------------------------
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30          # a stuck concurrency test must not run for hours
    defaults:
      run:
        working-directory: orderhub
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: orderhub/pom.xml
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw
      - name: Build and run tests
        run: ./mvnw -B verify
      - name: Keep the test reports if something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: orderhub/target/surefire-reports

  # ---------------------------------------------------------------
  # 2. Frontend: install, type-check and build, run the tests
  # ---------------------------------------------------------------
  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orderhub-web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orderhub-web/package-lock.json
      - run: npm ci
      - run: npm run build       # runs the TypeScript check, then builds
      - run: npm test

  # ---------------------------------------------------------------
  # 3. Docker: check the compose file, build both images, and (only on main) publish them
  # ---------------------------------------------------------------
  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]       # only runs if both jobs above passed
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write                # needed to publish to GitHub's registry
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v6

      - name: Check the compose file
        run: docker compose config -q
        env:                          # dummy values, only so the variables are defined
          DB_ROOT_PASSWORD: ci
          DB_PASSWORD: ci
          JWT_SECRET: ci
          WEBHOOK_SECRET: ci

      # Image names must be lowercase, and your GitHub user name may contain capitals.
      - name: Lowercase the owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and publish) the backend image
        uses: docker/build-push-action@v7
        with:
          context: ./orderhub
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/orderhub-backend:latest
            ghcr.io/${{ env.OWNER }}/orderhub-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build (and publish) the frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./orderhub-web
          push: ${{ env.PUBLISH == 'true' }}
          # Vite bakes this value into the JavaScript. It is a public ID, so a repository
          # variable (not a secret) is the right place for it. Leave the variable unset to hide the button.
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ env.OWNER }}/orderhub-frontend:latest
            ghcr.io/${{ env.OWNER }}/orderhub-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend