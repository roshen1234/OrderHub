spring.application.name=orderhub

spring.datasource.url=jdbc:mysql://localhost:3308/orderhub
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#when we mention it as validate when we create entitiy classes here and if it is missing a field when compared to actual db table. When we run the code hybernate will raise a issue.
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

#This creates or update the tables or columns in a db when we run the code (it executes the script that we have mentioned in db.migration, Once if a code is run it is not run again)
spring.flyway.enabled=true

logging.level.org.springframework.security=DEBUG

orderhub.jwt.secret=${JWT_SECRET}
orderhub.jwt.access-token-minutes=15
orderhub.jwt.refresh-token-days=7

orderhub.order.reservation-minutes=15

orderhub.payment.gateway=mock
orderhub.payment.webhook-secret=${WEBHOOK_SECRET}
orderhub.payment.pending-timeout-minutes=10

orderhub.google.client-id=${GOOGLE_CLIENT_ID:1038062553009-2scq6hegcd8e910nlr5ei8hjg1p92ei1.apps.googleusercontent.com}